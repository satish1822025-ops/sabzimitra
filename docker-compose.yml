version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sabzimitra-postgres
    environment:
      POSTGRES_DB: sabzimitra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sabzimitra-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sabzimitra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sabzimitra-net

  # Spring Boot Backend
  backend:
    build:
      context: ../sabzimitrabackend/sabzimitrabackend
      dockerfile: Dockerfile
    container_name: sabzimitra-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sabzimitra
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sabzimitra-net

  # Angular Frontend (production build served via nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabzimitra-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - sabzimitra-net

volumes:
  postgres_data:
  redis_data:

networks:
  sabzimitra-net:
    driver: bridge
